spring.application.name=backend
spring.data.mongodb.uri=${env.MONGODB_URI:${MONGODB_URI:}}
spring.data.mongodb.database=${env.MONGODB_DATABASE:${MONGODB_DATABASE:expense_tracker}}
jwt.secret=${env.JWT_SECRET:${JWT_SECRET:}}
jwt.expiration=${env.JWT_EXPIRATION:${JWT_EXPIRATION:86400000}}
server.port=${env.SERVER_PORT:${SERVER_PORT:${PORT:8080}}}
app.cors.allowed-origins=${env.CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}}
app.seed.enabled=${env.SEED_DEMO_DATA:${SEED_DEMO_DATA:false}}

# Brevo API Configuration (HTTP-based, no SMTP port needed)
brevo.api.key=${env.BREVO_API_KEY:${BREVO_API_KEY:}}
app.mail.from=${env.MAIL_FROM:${MAIL_FROM:your-email@gmail.com}}
app.mail.from-name=${env.MAIL_FROM_NAME:${MAIL_FROM_NAME:Expense Tracker}}
