spring.application.name=backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/expense_tracker}
spring.data.mongodb.database=${MONGODB_DATABASE:expense_tracker}
spring.data.mongodb.auto-index-creation=true
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.seed.enabled=${SEED_DEMO_DATA:false}
app.upload-dir=${UPLOAD_DIR:uploads}
app.media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.media.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.media.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# Set true temporarily on a host which still has the old uploads directory mounted.
# Migrated files are retained locally; this job only updates Mongo after a successful upload.
app.media.migration.enabled=${MEDIA_MIGRATION_ENABLED:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Brevo API Configuration
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:your-email@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Expense Tracker}
